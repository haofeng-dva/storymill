<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, 'Noto Serif SC', serif">
  <title>storymill 全流程示意图</title>
  <desc>九阶段主流程，分章写作与质量门槛闭环，以及输入输出存储</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#537D96"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9D5F4D"/>
    </marker>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A6B4A"/>
    </marker>
  </defs>
  <text x="30" y="16" font-size="13" font-weight="500" fill="#1B365D">主流程 · 八工位</text>
  <rect x="30" y="25" width="150" height="44" rx="2" fill="rgba(83,125,150,0.08)" stroke="#537D96" stroke-width="1"/>
  <text x="105" y="52" text-anchor="middle" font-size="13" font-weight="500" fill="#2A2622">选品 radar</text>
  <line x1="184" y1="47" x2="224" y2="47" stroke="#537D96" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="228" y="25" width="150" height="44" rx="2" fill="rgba(83,125,150,0.08)" stroke="#537D96" stroke-width="1"/>
  <text x="303" y="52" text-anchor="middle" font-size="13" font-weight="500" fill="#2A2622">方向管理</text>
  <line x1="382" y1="47" x2="422" y2="47" stroke="#537D96" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="426" y="25" width="150" height="44" rx="2" fill="rgba(83,125,150,0.08)" stroke="#537D96" stroke-width="1"/>
  <text x="501" y="52" text-anchor="middle" font-size="13" font-weight="500" fill="#2A2622">大纲 outline</text>
  <line x1="580" y1="47" x2="620" y2="47" stroke="#537D96" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="624" y="25" width="150" height="44" rx="2" fill="rgba(83,125,150,0.08)" stroke="#537D96" stroke-width="1"/>
  <text x="699" y="52" text-anchor="middle" font-size="13" font-weight="500" fill="#2A2622">设定圣经</text>
  <path d="M 699 69 L 699 90 L 105 90 L 105 69" fill="none" stroke="#537D96" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="30" y="105" width="150" height="44" rx="2" fill="#1B365D" stroke="#1B365D" stroke-width="1"/>
  <text x="105" y="132" text-anchor="middle" font-size="13" font-weight="500" fill="#FFFDF7">分章写作 ★</text>
  <line x1="184" y1="127" x2="224" y2="127" stroke="#537D96" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="228" y="105" width="150" height="44" rx="2" fill="rgba(83,125,150,0.08)" stroke="#537D96" stroke-width="1"/>
  <text x="303" y="132" text-anchor="middle" font-size="13" font-weight="500" fill="#2A2622">质检拦截</text>
  <line x1="382" y1="127" x2="422" y2="127" stroke="#537D96" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="426" y="105" width="150" height="44" rx="2" fill="rgba(83,125,150,0.08)" stroke="#537D96" stroke-width="1"/>
  <text x="501" y="132" text-anchor="middle" font-size="13" font-weight="500" fill="#2A2622">包装 EPUB</text>
  <line x1="580" y1="127" x2="620" y2="127" stroke="#537D96" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="624" y="105" width="150" height="44" rx="2" fill="rgba(83,125,150,0.08)" stroke="#537D96" stroke-width="1"/>
  <text x="699" y="132" text-anchor="middle" font-size="13" font-weight="500" fill="#2A2622">调度看板</text>
  <text x="30" y="180" font-size="13" font-weight="500" fill="#1B365D">分章写作内部 · 质量门槛闭环</text>
  <rect x="30" y="190" width="180" height="52" rx="2" fill="rgba(83,125,150,0.08)" stroke="#537D96" stroke-width="1"/>
  <text x="120" y="213" text-anchor="middle" font-size="12" fill="#2A2622">模型分段写一章</text>
  <text x="120" y="230" text-anchor="middle" font-size="11" fill="#6B6158">GPT 300词/段 + 冷却</text>
  <line x1="214" y1="216" x2="254" y2="216" stroke="#537D96" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="258" y="190" width="180" height="52" rx="2" fill="rgba(83,125,150,0.08)" stroke="#537D96" stroke-width="1"/>
  <text x="348" y="213" text-anchor="middle" font-size="12" fill="#2A2622">程序数字数</text>
  <text x="348" y="230" text-anchor="middle" font-size="11" fill="#6B6158">620-1320 区间硬校验</text>
  <path d="M 348 190 L 348 172 L 120 172 L 120 190" fill="none" stroke="#9D5F4D" stroke-width="1" marker-end="url(#ar2)"/>
  <text x="225" y="166" text-anchor="middle" font-size="11" fill="#9D5F4D">字数不足 · 带具体反馈重写</text>
  <line x1="442" y1="216" x2="482" y2="216" stroke="#537D96" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="486" y="190" width="180" height="52" rx="2" fill="rgba(83,125,150,0.08)" stroke="#537D96" stroke-width="1"/>
  <text x="576" y="213" text-anchor="middle" font-size="12" fill="#2A2622">质量盲评 GPT</text>
  <text x="576" y="230" text-anchor="middle" font-size="11" fill="#6B6158">naturalness &lt;4 不通过</text>
  <path d="M 576 190 L 576 160 L 660 160 L 660 173" fill="none" stroke="#9D5F4D" stroke-width="1" marker-end="url(#ar2)"/>
  <rect x="670" y="163" width="190" height="34" rx="2" fill="rgba(157,95,77,0.08)" stroke="#9D5F4D" stroke-width="1"/>
  <text x="765" y="184" text-anchor="middle" font-size="11" fill="#9D5F4D">沉淀 lessons.json · 书内自学习</text>
  <path d="M 855 180 L 872 180 L 872 216 L 670 216" fill="none" stroke="#9D5F4D" stroke-width="1" marker-end="url(#ar2)"/>
  <text x="762" y="206" text-anchor="middle" font-size="11" fill="#9D5F4D">带原因重写</text>
  <line x1="670" y1="216" x2="700" y2="216" stroke="#4A6B4A" stroke-width="1" marker-end="url(#ar)"/>
  <text x="782" y="242" text-anchor="middle" font-size="12" font-weight="500" fill="#4A6B4A">≥4 通过 → 进质检</text>
  <line x1="765" y1="252" x2="765" y2="262" stroke="#4A6B4A" stroke-width="1"/>
  <line x1="765" y1="262" x2="303" y2="262" stroke="#4A6B4A" stroke-width="1" marker-end="url(#ar)"/>
  <text x="30" y="296" font-size="13" font-weight="500" fill="#1B365D">数据存放</text>
  <rect x="30" y="306" width="250" height="44" rx="2" fill="rgba(83,125,150,0.08)" stroke="#537D96" stroke-width="1"/>
  <text x="155" y="325" text-anchor="middle" font-size="12" font-weight="500" fill="#2A2622">输入</text>
  <text x="155" y="342" text-anchor="middle" font-size="11" fill="#6B6158">rec_N.txt · config.json · 词表 · keys</text>
  <rect x="310" y="306" width="250" height="44" rx="2" fill="rgba(157,95,77,0.08)" stroke="#9D5F4D" stroke-width="1"/>
  <text x="435" y="325" text-anchor="middle" font-size="12" font-weight="500" fill="#9D5F4D">中间产物</text>
  <text x="435" y="342" text-anchor="middle" font-size="11" fill="#6B6158">outline · world_bible · lessons</text>
  <rect x="590" y="306" width="250" height="44" rx="2" fill="rgba(74,107,74,0.08)" stroke="#4A6B4A" stroke-width="1"/>
  <text x="715" y="325" text-anchor="middle" font-size="12" font-weight="500" fill="#4A6B4A">输出</text>
  <text x="715" y="342" text-anchor="middle" font-size="11" fill="#6B6158">ch*.md · EPUB · 发布清单 · 摘要</text>
  <rect x="30" y="364" width="810" height="46" rx="2" fill="#FAF9F5" stroke="#D8CFBE" stroke-width="0.5"/>
  <text x="435" y="384" text-anchor="middle" font-size="12" fill="#4A433C">分工哲学：模型负责想（大纲 / 圣经 / 写章），程序负责查（数字数 / 判达标 / 管教训）</text>
  <text x="435" y="401" text-anchor="middle" font-size="11" fill="#6B6158">可靠的部分管住不可靠的部分 · 每章写后盲评重写 · 失败教训回灌本书</text>
</svg>
